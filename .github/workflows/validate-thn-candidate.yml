# QA evidence only. This workflow never promotes or deploys a release.
name: Validate THN candidate (no deploy)

on:
  push:
    branches: ['codex/thn-content-hub-task029-integration']

permissions:
  contents: read

concurrency:
  group: thn-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      SAM_CLI_TELEMETRY: '0'
      LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history with the pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history" --redact=100 --no-banner --ignore-gitleaks-allow .
      - name: Check out reviewed QA fixture thehairnarrative.com
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: Toydrum/draft-thehairnarrative-com
          ref: 1efa3d214b209fc9da6ffa6102a53eddf715650e
          path: drafts/thehairnarrative.com
          persist-credentials: false
      - name: Check out reviewed QA fixture grupoastralegal.com
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: LynxPardelle/draft-grupoastralegal-com
          ref: 5872728012e6955bc201324400caad8eadd295a2
          path: drafts/grupoastralegal.com
          persist-credentials: false
      - name: Check out reviewed QA fixture zoolandingpage.com.mx
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: LynxPardelle/draft-zoolandingpage-com-mx
          ref: 9865bd276317b6b808027bce919970695c759a68
          path: drafts/zoolandingpage.com.mx
          persist-credentials: false
      - name: Check out reviewed QA fixture pamelabetancourt.com
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: LynxPardelle/draft-pamelabetancourt-com
          ref: 47e95f5e2a0631a5c9af3129a67d640810535430
          path: drafts/pamelabetancourt.com
          persist-credentials: false
      - name: Check out reviewed QA fixture zoositioweb.com.mx
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: LynxPardelle/draft-zoositioweb-com-mx
          ref: 50740cfa5b6428a08c981563aa96ae8096d736df
          path: drafts/zoositioweb.com.mx
          persist-credentials: false
      - name: Check out reviewed QA fixture erosbarajas.com
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: LynxPardelle/draft-erosbarajas-com
          ref: b896ae2afa472c734209d980cb6615303d1ef0c8
          path: drafts/erosbarajas.com
          persist-credentials: false
      - name: Check out reviewed QA fixture sulandingpage.com.mx
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: LynxPardelle/draft-sulandingpage-com-mx
          ref: 2f24c36f1342f018789d655563ae0eda9c010268
          path: drafts/sulandingpage.com.mx
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Test and package the isolated frontend candidate
        run: |
          npm ci
          node --test tools/tests/draft-public-safety-audit.spec.mjs tools/tests/ssr-delivery-contract.spec.mjs tools/tests/legacy-ssr-recovery.spec.mjs tools/tests/ops-thn-content-hub-v2-front-door.spec.mjs tools/tests/draft-public-artifact-boundary.spec.mjs tools/tests/the-hair-narrative-public-assets.spec.mjs
          npm test -- --watch=false --browsers=ChromeHeadlessStable
          npm run package:ssr:lambda
          node --test tools/tests/ssr-server.spec.mjs
          mkdir -p logs/thn-ci
          cp dist/ssr-lambda/ssr-handler.zip logs/thn-ci/candidate.zip
      - name: Record exact source, run and candidate digest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive = Path('logs/thn-ci/candidate.zip')
          record = {
              'schemaVersion': 1, 'purpose': 'validation-only', 'deployable': False,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceRef': os.environ['GITHUB_REF'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'packageFile': archive.name,
              'packageSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'packageBytes': archive.stat().st_size,
          }
          Path('logs/thn-ci/source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thn-candidate-frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/thn-ci/candidate.zip
            logs/thn-ci/source.json
          retention-days: 30
          if-no-files-found: error
