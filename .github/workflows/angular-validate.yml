name: Angular validate

on:
  pull_request:
  push:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Angular validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node --test tools/tests/components-schema.spec.mjs tools/tests/site-config-schema.spec.mjs tools/tests/the-hair-narrative-public-assets.spec.mjs tools/tests/draft-public-artifact-boundary.spec.mjs
      - run: npm test -- --watch=false --browsers=ChromeHeadlessStable
      - run: npm audit --omit=dev
      - run: npm run package:ssr:lambda
      - run: npm run test:browser-icons:built
