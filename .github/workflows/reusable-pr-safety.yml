name: Reusable PR safety

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate caller repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          path: caller

      - name: Check out pinned hub policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: LynxPardelle/zoolandingpage
          ref: d8494f0ae446a51d5ca9740a4831635e43bd5a79
          persist-credentials: false
          path: policy

      - name: Install pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/pr-safety-bin"
          mkdir -p "$bin_dir"

          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$actionlint_archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_archive" | sha256sum -c -
          tar -xzf "$actionlint_archive" -C "$bin_dir" actionlint

          gitleaks_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSLo "$gitleaks_archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $gitleaks_archive" | sha256sum -c -
          tar -xzf "$gitleaks_archive" -C "$bin_dir" gitleaks

          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate tracked workflows
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git -C caller ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if (( ${#files[@]} )); then
            paths=()
            for file in "${files[@]}"; do paths+=("caller/$file"); done
            actionlint "${paths[@]}"
          fi

      - name: Validate tracked JSON and scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "caller/$file"
          done < <(git -C caller ls-files -z -- '*.json')

          while IFS= read -r -d '' file; do
            node --check "caller/$file"
          done < <(git -C caller ls-files -z -- '*.js' '*.mjs' '*.cjs')

      - name: Run canonical public-safety audit
        run: node policy/tools/draft-public-safety-audit.mjs --repo=caller --history=true --summary=true

      - name: Scan full history for secrets
        env:
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: gitleaks git --log-opts="--all" --redact --no-banner caller
